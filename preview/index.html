<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Button preview</title>
  <link rel="stylesheet" href="../components/Button.css">
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: var(--spacing-md);
    }

    table {
      border-spacing: var(--spacing-md);
    }

    th {
      text-align: left;
      font-weight: normal;
      color: var(--color-disabled-text);
    }

    .row {
      display: flex;
      gap: var(--spacing-md);
    }
  </style>
</head>
<body>
  <h1>Button</h1>

  <h2>All states</h2>
  <table>
    <thead>
      <tr>
        <th></th>
        <th>Default</th>
        <th>Hover</th>
        <th>Focus</th>
        <th>Disabled</th>
      </tr>
    </thead>
    <tbody id="states"></tbody>
  </table>

  <h2>Interactive</h2>
  <p>Press Tab to move between buttons, Enter or Space to press one. Disabled buttons are skipped.</p>
  <div class="row" id="interactive"></div>
  <p id="status" role="status"></p>

  <script type="module">
    import { loadTokens } from '../tokens/load-tokens.js';
    import { Button } from '../components/Button.js';

    await loadTokens();

    const variants = ['primary', 'secondary'];
    const states = [
      { name: 'default' },
      { name: 'hover', className: 'is-hover' },
      { name: 'focus', className: 'is-focus' },
      { name: 'disabled', disabled: true },
    ];

    const tbody = document.getElementById('states');

    for (const variant of variants) {
      const row = document.createElement('tr');
      const heading = document.createElement('th');
      heading.textContent = variant;
      row.append(heading);

      for (const state of states) {
        const button = Button({ label: 'Button', variant, disabled: state.disabled });
        if (state.className) {
          button.classList.add(state.className);
        }
        // Static examples shouldn't be clickable or reachable with Tab.
        button.tabIndex = -1;

        const cell = document.createElement('td');
        cell.append(button);
        row.append(cell);
      }

      tbody.append(row);
    }

    const interactive = document.getElementById('interactive');
    const status = document.getElementById('status');
    for (const variant of variants) {
      const label = `${variant} button`;
      const onClick = () => {
        status.textContent = `You pressed: ${label}`;
      };
      interactive.append(Button({ label, variant, onClick }));
      interactive.append(Button({ label: `Disabled ${variant}`, variant, disabled: true }));
    }
  </script>
</body>
</html>
